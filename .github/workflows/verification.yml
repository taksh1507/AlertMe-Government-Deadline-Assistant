name: Application verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      ALLOW_TEST_DATABASE_RESET: '1'
      QT_QPA_PLATFORM: offscreen
      ALERTME_SCREENSHOT_DIR: ${{ github.workspace }}/test-results/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Alertme/requirements-api.txt
            Alertme/requirements.txt
            requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt pip-audit
      - run: python -m pip_audit
      - run: python -m ruff check Alertme tests
      - run: python -m ruff format --check Alertme tests
      - run: python -m compileall -q Alertme
      - run: python -m pytest tests -q
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-check-output
          path: test-results/
          retention-days: 3
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      ALLOW_TEST_DATABASE_RESET: '1'
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=low
      - run: npm run check:web
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-check-output
          path: test-results/
          retention-days: 3
